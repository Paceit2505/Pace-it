<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecionando…</title>
  <script>
    (function () {
      var basePath = '/Pace-it';
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      // If the path starts with basePath and doesn't end with '/', add trailing slash
      if (path.startsWith(basePath) && !path.endsWith('/') && path !== basePath) {
        window.location.replace(path + '/' + search + hash);
        return;
      }
      // Otherwise go to app root
      window.location.replace(basePath + '/' + search + hash);
    })();
  </script>
</head>
<body>
  <p style="font-family:monospace;padding:2rem;color:#888">Redirecionando…</p>
</body>
</html>
